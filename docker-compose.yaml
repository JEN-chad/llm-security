services:

  db-service:
    build: ./db-service
    container_name: db-service
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_ohD2sFq9evLU@ep-orange-union-ai0vct77-pooler.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require
      PORT: "8002"
    ports:
      - "8002:8002"

  policy-engine:
    build: ./policy-engine
    container_name: policy-engine
    restart: always
    depends_on:
      - db-service
    environment:
      DB_SERVICE_URL: http://db-service:8002
    ports:
      - "8001:8001"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - policy-engine
    env_file:
      - .env
    environment:
      POLICY_ENGINE_URL: http://policy-engine:8001
      LLM_API_KEY: dummy_key
    ports:
      - "8000:8000"
